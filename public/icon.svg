<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161920" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#gradBg)" stroke="#262B35" stroke-width="8"/>
  
  <!-- Subtle Shield / Vault Outline for E2EE -->
  <path d="M256 90 C340 90 380 120 380 120 V250 C380 340 256 420 256 420 C256 420 132 340 132 250 V120 C132 120 172 90 256 90 Z" 
        fill="none" stroke="#22C55E" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="8 6"/>

  <!-- Core Notesnook / Focus Logo (Notepad + Lightning / Checkmark Node) -->
  <g transform="translate(146, 136) scale(0.85)">
    <!-- Notepad card -->
    <rect x="20" y="20" width="220" height="260" rx="24" fill="#1C212B" stroke="#2C3340" stroke-width="6"/>
    <!-- Note horizontal lines -->
    <rect x="60" y="75" width="140" height="12" rx="6" fill="#3A4454"/>
    <rect x="60" y="115" width="100" height="12" rx="6" fill="#3A4454"/>
    <rect x="60" y="155" width="120" height="12" rx="6" fill="#3A4454"/>
    
    <!-- Vivid Green Quill / Checkmark with Glow -->
    <circle cx="195" cy="225" r="48" fill="#161920" stroke="#22C55E" stroke-width="5" filter="url(#glow)"/>
    <circle cx="195" cy="225" r="40" fill="url(#accentGrad)"/>
    <!-- Lock / Checkmark vector inside badge -->
    <path d="M182 225 L191 234 L208 217" fill="none" stroke="#0F1115" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
